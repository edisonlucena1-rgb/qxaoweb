            <div class="border-l-2 border-gray-300 dark:border-gray-600 pl-3 flex flex-col justify-center">
                <span class="block text-[10px] text-[#690991] dark:text-[#c75ced] font-bold tracking-widest uppercase">Panel Maestro</span>
                <span id="top-admin-name" class="block text-sm font-bold text-gray-800 dark:text-gray-200">Admin</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button id="theme-toggle" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-[#690991] transition shadow-sm">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            </button>
            <button onclick="openModal('create')" class="bg-[#690991] hover:bg-[#4a0066] text-white px-6 py-3 rounded-xl text-sm font-bold shadow-lg shadow-[#690991]/30 transition flex items-center gap-2">
                <span>+</span> Crear Usuario
            </button>
            <a href="#" onclick="logout()" class="bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 px-4 py-2 rounded-xl text-sm font-semibold transition">Cerrar Sesión</a>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        
        <div class="flex flex-col sm:flex-row justify-between items-center bg-white dark:bg-darkCard p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Gestión de Clientes Corporativos</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Administra accesos, resetea credenciales y monitorea el estado.</p>
            </div>
            <button onclick="openModal('create')" class="bg-[#690991] hover:bg-[#4a0066] text-white px-6 py-3 rounded-xl text-sm font-bold shadow-lg shadow-[#690991]/30 transition flex items-center gap-2">
                <span>+</span> Crear Usuario
            </button>
        </div>

        <div class="bg-white dark:bg-darkCard rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700 text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">
                            <th class="p-4 font-semibold">ID</th>
                            <th class="p-4 font-semibold">Cliente</th>
                            <th class="p-4 font-semibold">Empresa</th>
                            <th class="p-4 font-semibold">Correo</th>
                            <th class="p-4 font-semibold">Estado</th>
                            <th class="p-4 font-semibold text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                        <tr><td colspan="6" class="p-8 text-center text-gray-500">Cargando base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODAL (AHORA MUESTRA LA CLAVE SIEMPRE) -->
        <div id="user-modal" class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
            <div class="bg-white dark:bg-darkCard w-full max-w-md p-8 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 transform scale-95 transition-transform duration-300 relative" id="modal-content">
                <button type="button" onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                
                <h2 id="modal-title" class="text-xl font-bold text-[#690991] dark:text-[#c75ced] mb-6">Nuevo Cliente Corporativo</h2>
                
                <form id="user-form" class="space-y-4">
                    <input type="hidden" id="edit-user-id">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Nombre</label>
                        <input type="text" id="m-name" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:border-[#690991] dark:text-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Empresa</label>
                        <input type="text" id="m-company" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:border-[#690991] dark:text-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Correo Electrónico</label>
                        <input type="email" id="m-email" required class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:border-[#690991] dark:text-white transition">
                    </div>
                    
                    <!-- EL CAMPO DE CONTRASEÑA MODIFICADO -->
                    <div id="password-container">
                        <label id="m-password-label" class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Contraseña</label>
                        <input type="password" id="m-password" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:border-[#690991] dark:text-white transition">
                    </div>
                    
                    <p id="modal-error" class="hidden text-red-500 text-sm font-medium text-center"></p>
                    
                    <button type="submit" id="btn-save" class="w-full bg-[#690991] hover:bg-[#4a0066] text-white py-3 rounded-xl font-bold transition shadow-lg shadow-[#690991]/30 mt-4">
                        Guardar
                    </button>
                </form>
            </div>
        </div>

    </main>

    <script>
        let globalUsersList = []; 
        let currentModalMode = 'create'; 

        window.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('user_name');
            if (userName) document.getElementById('top-admin-name').textContent = userName;
            fetchUsers();
        });

        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        async function fetchUsers() {
            const tableBody = document.getElementById('users-table-body');
            try {
                const response = await fetch('http://127.0.0.1:8000/api/admin/users');
                const users = await response.json();
                
                tableBody.innerHTML = ''; 
                if (users.length === 0) return tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">Vacío</td></tr>`;
                
                globalUsersList = users;
                let clientesMostrados = 0;

                users.forEach(user => {
                    if (user.email === 'admin@qxao.com') return; 
                    clientesMostrados++;

                    const statusClass = user.is_active 
                        ? 'bg-green-100 text-green-700 dark:bg-green-500/10 dark:text-green-400 border-green-200 dark:border-green-500/20' 
                        : 'bg-red-100 text-red-700 dark:bg-red-500/10 dark:text-red-400 border-red-200 dark:border-red-500/20';
                    
                    const blockBtnText = user.is_active ? 'Bloquear' : 'Desbloquear';
                    const blockBtnColor = user.is_active ? 'text-red-500 bg-red-50 dark:bg-red-900/20 hover:text-red-700' : 'text-orange-500 bg-orange-50 dark:bg-orange-900/20 hover:text-orange-700';

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors group';
                    row.innerHTML = `
                        <td class="p-4 text-gray-500 dark:text-gray-400 font-medium">#${user.id}</td>
                        <td class="p-4 font-semibold text-gray-900 dark:text-white">${user.full_name}</td>
                        <td class="p-4 text-gray-600 dark:text-gray-300">${user.company_name}</td>
                        <td class="p-4 text-gray-500 dark:text-gray-400">${user.email}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-bold border ${statusClass}">
                                ${user.status}
                            </span>
                        </td>
                        <td class="p-4 text-right space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="abrirEditar(${user.id})" class="text-blue-500 hover:text-blue-700 text-xs font-bold px-2 py-1 bg-blue-50 dark:bg-blue-900/20 rounded-md">Editar</button>
                            <button onclick="toggleBloquear(${user.id})" class="${blockBtnColor} text-xs font-bold px-2 py-1 rounded-md">${blockBtnText}</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                if (clientesMostrados === 0) tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">Crea tu primer cliente.</td></tr>`;

            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">Error al conectar con Uvicorn.</td></tr>`;
            }
        }

        function abrirEditar(id) {
            const user = globalUsersList.find(u => u.id === id);
            if (!user) return;

            document.getElementById('edit-user-id').value = user.id;
            document.getElementById('m-name').value = user.full_name;
            document.getElementById('m-company').value = user.company_name;
            document.getElementById('m-email').value = user.email;
            
            openModal('edit');
        }

        async function toggleBloquear(id) {
            try {
                await fetch(`http://127.0.0.1:8000/api/admin/users/${id}/toggle-block`, { method: 'PUT' });
                fetchUsers(); 
            } catch (error) {
                alert("Error al intentar cambiar el estado del usuario.");
            }
        }
        
        function openModal(mode) {
            currentModalMode = mode;
            const modal = document.getElementById('user-modal');
            const content = document.getElementById('modal-content');
            const passInput = document.getElementById('m-password');
            const passLabel = document.getElementById('m-password-label');
            const title = document.getElementById('modal-title');

            passInput.value = ''; // Limpiamos la casilla siempre por seguridad

            if (mode === 'create') {
                document.getElementById('user-form').reset();
                title.textContent = "Nuevo Cliente Corporativo";
                passLabel.textContent = "Contraseña";
                passInput.required = true;
                passInput.placeholder = "••••••••";
            } else {
                title.textContent = "Editar Cliente";
                passLabel.textContent = "Nueva Contraseña (Opcional)";
                passInput.required = false;
                passInput.placeholder = "Déjalo vacío para no cambiarla";
            }

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('user-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const btn = document.getElementById('btn-save');
            const errorMsg = document.getElementById('modal-error');
            btn.textContent = 'Guardando...'; btn.disabled = true; errorMsg.classList.add('hidden');

            try {
                let url = 'http://127.0.0.1:8000/api/admin/users';
                let method = 'POST';
                let payload = {
                    full_name: document.getElementById('m-name').value,
                    company_name: document.getElementById('m-company').value,
                    email: document.getElementById('m-email').value,
                    password: document.getElementById('m-password').value // Ahora enviamos la contraseña siempre
                };

                if (currentModalMode === 'edit') {
                    const id = document.getElementById('edit-user-id').value;
                    url = `${url}/${id}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    closeModal();
                    fetchUsers(); 
                } else {
                    errorMsg.textContent = data.detail || 'Error al guardar.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.textContent = 'Error conectando con el servidor.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Guardar'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
